name: Deploy to Azure Static Web Apps

# The Static Web App is created WITHOUT GitHub integration (see infra/main.bicep),
# so this workflow is the only thing that deploys. Azure never rewrites it.
# It needs one repository secret: AZURE_STATIC_WEB_APPS_API_TOKEN

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the question bank
        run: node tools/check-bank.js

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "web"
          api_location: "api"
          output_location: ""

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Close preview environment
    runs-on: ubuntu-latest
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
